<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Бюджет</title>
<style>
  :root {
    --bg: #17171a;
    --surface: #1d1d20;
    --surface-2: #232326;
    --border: #313136;
    --text: #dcdad4;
    --muted: #8a8983;
    --muted-2: #5c5b57;
    --accent: #b9975a;
    --red: #b2564b;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    min-height: 100vh;
    padding: 2.5rem 1.25rem 5rem;
    line-height: 1.4;
  }

  ::selection { background: rgba(185,151,90,0.25); color: var(--text); }

  /* ---------- Access stub ---------- */
  .stub {
    min-height: calc(100vh - 5rem);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .stub-inner {
    text-align: left;
    max-width: 380px;
    padding: 2rem;
    border-left: 2px solid var(--border);
  }

  .stub-tag {
    font-size: 0.72rem;
    color: var(--muted-2);
    margin-bottom: 1.25rem;
    font-family: var(--font-mono);
  }

  .stub-title {
    font-weight: 600;
    font-size: 2rem;
    letter-spacing: -0.01em;
    line-height: 1.15;
    color: var(--text);
  }

  .stub p {
    margin-top: 1.25rem;
    font-size: 0.9rem;
    color: var(--muted);
    line-height: 1.7;
  }

  /* ---------- Layout ---------- */
  header {
    max-width: 760px;
    margin: 0 auto 2rem;
    display: flex;
    align-items: baseline;
    gap: 0.75rem;
    padding-bottom: 1.25rem;
    border-bottom: 1px solid var(--border);
  }

  header h1 {
    font-size: 1.15rem;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  header .sub {
    font-size: 0.82rem;
    color: var(--muted);
  }

  #save-status {
    margin-left: auto;
    font-size: 0.78rem;
    color: var(--muted-2);
  }

  #save-status.error { color: var(--red); }

  .main {
    max-width: 760px;
    margin: 0 auto;
    display: grid;
    gap: 1.75rem;
  }

  /* ---------- Stats ---------- */
  .stats {
    display: flex;
    gap: 0;
    border: 1px solid var(--border);
  }

  .stat {
    flex: 1;
    padding: 0.95rem 1.2rem;
    border-left: 1px solid var(--border);
  }

  .stat:first-child { border-left: none; }

  .stat-label {
    font-size: 0.76rem;
    color: var(--muted);
    margin-bottom: 0.35rem;
  }

  .stat-value {
    font-family: var(--font-mono);
    font-size: 1.25rem;
    font-weight: 500;
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
  }

  .stat.income .stat-value { color: var(--text); }
  .stat.expense .stat-value { color: var(--text); }
  .stat.balance .stat-value { color: var(--accent); }
  .stat.balance.neg .stat-value { color: var(--red); }

  /* ---------- Form card ---------- */
  .form-card {
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.4rem 1.4rem 1.5rem;
    background: linear-gradient(165deg, var(--surface-2), var(--surface) 60%);
    box-shadow: 0 10px 30px -12px rgba(0,0,0,0.45);
  }

  .form-card-title {
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 1.1rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .form-card-title::before {
    content: '';
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
  }

  .form-grid {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr;
    gap: 0.75rem;
    margin-bottom: 0.9rem;
  }

  .form-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 0.9rem;
    align-items: end;
    margin-bottom: 0.9rem;
  }

  .field label {
    display: block;
    font-size: 0.72rem;
    color: var(--muted);
    margin-bottom: 0.4rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .field input,
  .field select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 0.6rem 0.75rem;
    color: var(--text);
    font-family: var(--font);
    font-size: 0.9rem;
    transition: border-color 0.15s, box-shadow 0.15s;
    -webkit-appearance: none;
  }

  .field input::placeholder { color: var(--muted-2); }

  .field input:focus,
  .field select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(185,151,90,0.15);
  }

  .field select option { background: var(--surface); }

  .type-toggle {
    display: flex;
    border-radius: 9px;
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 3px;
    gap: 3px;
  }

  .type-toggle button {
    flex: 1;
    background: none;
    border: none;
    border-radius: 6px;
    color: var(--muted);
    font-family: var(--font);
    font-size: 0.85rem;
    font-weight: 500;
    padding: 0.55rem 0.4rem;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }

  .type-toggle button#type-expense.active {
    background: rgba(178,86,75,0.18);
    color: #d98f85;
  }

  .type-toggle button#type-income.active {
    background: rgba(107,176,138,0.18);
    color: #7fcaa1;
  }

  .cat-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
  }

  .cat-chip {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.4rem 0.85rem;
    color: var(--muted);
    font-family: var(--font);
    font-size: 0.82rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.45rem;
    transition: border-color 0.15s, color 0.15s;
  }

  .cat-chip .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  .cat-chip.active {
    color: var(--text);
    border-color: var(--muted-2);
    background: var(--surface-2);
  }

  .add-btn {
    background: linear-gradient(135deg, var(--accent), #cba76a);
    color: #1a1509;
    border: none;
    border-radius: 9px;
    padding: 0 1.5rem;
    height: 40px;
    font-family: var(--font);
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: transform 0.12s, box-shadow 0.12s;
  }

  .add-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px -6px rgba(185,151,90,0.6); }
  .add-btn:active { transform: translateY(0); opacity: 0.9; }
  .add-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ---------- Category chart ---------- */
  .chart-card {
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.4rem;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 1.75rem;
    align-items: center;
  }

  .chart-card-title {
    font-size: 0.95rem;
    font-weight: 600;
    margin-bottom: 1rem;
    grid-column: 1 / -1;
  }

  .donut {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    position: relative;
    flex-shrink: 0;
  }

  .donut::after {
    content: '';
    position: absolute;
    inset: 20px;
    border-radius: 50%;
    background: var(--surface);
  }

  .donut-center {
    position: absolute;
    inset: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    z-index: 1;
  }

  .donut-center .val {
    font-family: var(--font-mono);
    font-size: 1.05rem;
    font-weight: 600;
  }

  .donut-center .lbl {
    font-size: 0.68rem;
    color: var(--muted);
    margin-top: 2px;
  }

  .legend {
    display: grid;
    gap: 0.55rem;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-size: 0.85rem;
  }

  .legend-item .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .legend-item .name { color: var(--text); flex: 1; }
  .legend-item .pct { color: var(--muted); font-family: var(--font-mono); font-size: 0.8rem; margin-right: 0.5rem; }
  .legend-item .amt { font-family: var(--font-mono); font-size: 0.82rem; color: var(--muted); }

  @media (max-width: 640px) {
    .chart-card { grid-template-columns: 1fr; justify-items: center; text-align: center; }
    .legend { width: 100%; }
  }

  /* ---------- Filters ---------- */
  .filter-bar {
    display: flex;
    gap: 0.4rem;
    flex-wrap: wrap;
  }

  .filter-btn {
    background: none;
    border: 1px solid var(--border);
    padding: 0.35rem 0.85rem;
    color: var(--muted);
    font-family: var(--font);
    font-size: 0.82rem;
    cursor: pointer;
  }

  .filter-btn.active {
    border-color: var(--accent);
    color: var(--accent);
  }

  .filter-btn:hover:not(.active) { border-color: var(--muted-2); color: var(--text); }

  /* ---------- Entries ---------- */
  .entries-card {
    border: 1px solid var(--border);
  }

  .entries-header {
    display: grid;
    grid-template-columns: 1fr 110px 110px 30px;
    padding: 0.6rem 1.1rem;
    border-bottom: 1px solid var(--border);
    font-size: 0.75rem;
    color: var(--muted-2);
  }

  .total-sum {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.7rem 1.1rem;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    font-size: 0.82rem;
    color: var(--muted);
  }

  .total-sum .entry-amount { padding-right: 0; font-size: 0.95rem; }

  .entry {
    display: grid;
    grid-template-columns: 1fr 110px 110px 30px;
    padding: 0.75rem 1.1rem;
    border-bottom: 1px solid var(--border);
    align-items: center;
  }

  .entry:last-child { border-bottom: none; }
  .entry:hover { background: var(--surface); }

  .entry-desc { font-weight: 500; font-size: 0.92rem; }
  .entry-date { font-size: 0.78rem; color: var(--muted-2); margin-top: 2px; }

  .cat-tag {
    font-size: 0.78rem;
    color: var(--muted);
  }

  .entry-amount {
    font-family: var(--font-mono);
    font-size: 0.92rem;
    font-variant-numeric: tabular-nums;
    text-align: right;
    padding-right: 0.5rem;
  }

  .entry-amount.pos { color: var(--text); }
  .entry-amount.neg { color: var(--muted); }

  .del-btn {
    width: 26px;
    height: 26px;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--muted-2);
    font-size: 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-left: auto;
  }

  .del-btn:hover { color: var(--red); }

  .empty {
    padding: 2.5rem 2rem;
    text-align: center;
    color: var(--muted-2);
    font-size: 0.88rem;
  }

  .expandable { cursor: pointer; }

  .expand-arrow {
    font-size: 0.7rem;
    color: var(--muted-2);
    display: inline-block;
    width: 10px;
  }

  .count-badge {
    font-size: 0.72rem;
    color: var(--muted-2);
  }

  .sub-row { background: var(--surface); }

  .sub-desc {
    font-size: 0.82rem !important;
    color: var(--muted) !important;
    font-weight: 400 !important;
    padding-left: 1.2rem;
  }

  .sub-amount { opacity: 0.8; }

  @media (max-width: 640px) {
    body { padding: 1.5rem 0.9rem 4rem; }
    .form-grid { grid-template-columns: 1fr 1fr; }
    .form-row  { grid-template-columns: 1fr 1fr; }
    .stats     { flex-wrap: wrap; }
    .stat      { min-width: 33%; border-bottom: 1px solid var(--border); }
    .entries-header { display: none; }
    .entry { grid-template-columns: 1fr auto 28px; padding: 0.7rem 0.9rem; }
    .entry .cat-col { display: none; }
    .total-sum { padding: 0.6rem 0.9rem; }
  }
</style>
</head>
<body>

<div class="stub" id="stub">
  <div class="stub-inner">
    <div class="stub-tag">401</div>
    <div class="stub-title">Нет доступа</div>
    <p>Эта страница только для двоих. Если у тебя нет ссылки с ключом — здесь действительно ничего нет.</p>
  </div>
</div>

<div id="app" style="display:none">

<header>
  <h1>Наши расходы</h1>
  <span class="sub" id="month-label"></span>
  <span id="save-status"></span>
</header>

<div class="main">

  <div class="stats">
    <div class="stat income">
      <div class="stat-label">Доходы</div>
      <div class="stat-value" id="s-income">0 ₽</div>
    </div>
    <div class="stat expense">
      <div class="stat-label">Расходы</div>
      <div class="stat-value" id="s-expense">0 ₽</div>
    </div>
    <div class="stat balance" id="s-balance-card">
      <div class="stat-label">Баланс</div>
      <div class="stat-value" id="s-balance">0 ₽</div>
    </div>
  </div>

  <div class="form-card">
    <div class="form-card-title">Новая запись</div>
    <div class="form-grid">
      <div class="field">
        <label>Описание</label>
        <input type="text" id="f-desc" placeholder="Продукты, кафе, зарплата...">
      </div>
      <div class="field">
        <label>Сумма, ₽</label>
        <input type="number" id="f-amount" placeholder="0" min="0">
      </div>
      <div class="field">
        <label>Дата</label>
        <input type="date" id="f-date">
      </div>
    </div>
    <div class="field" style="margin-bottom:0.9rem">
      <label>Категория</label>
      <div class="cat-chips" id="cat-chips"></div>
      <input type="hidden" id="f-cat" value="Еда">
    </div>
    <div class="form-row">
      <div class="field">
        <label>Тип</label>
        <div class="type-toggle">
          <button type="button" class="active" id="type-expense" onclick="setType('expense')">Расход</button>
          <button type="button" id="type-income" onclick="setType('income')">Доход</button>
        </div>
      </div>
      <button class="add-btn" id="add-btn" onclick="addEntry()">Добавить</button>
    </div>
    <div class="field" style="margin-top:0.9rem">
      <label>Метод</label>
      <select id="f-method">
        <option value="Карта">Карта</option>
        <option value="Наличные">Наличные</option>
        <option value="Перевод">Перевод</option>
      </select>
    </div>
  </div>

  <div class="chart-card">
    <div class="chart-card-title">По категориям</div>
    <div class="donut" id="donut">
      <div class="donut-center">
        <div class="val" id="donut-total">0 ₽</div>
        <div class="lbl">расходы</div>
      </div>
    </div>
    <div class="legend" id="legend"></div>
  </div>

  <div class="filter-bar">
    <button class="filter-btn active" onclick="setFilter('all', this)">Все</button>
    <button class="filter-btn" onclick="setFilter('expense', this)">Расходы</button>
    <button class="filter-btn" onclick="setFilter('income', this)">Доходы</button>
    <button class="filter-btn" onclick="setFilter('Еда', this)">Еда</button>
    <button class="filter-btn" onclick="setFilter('Транспорт', this)">Транспорт</button>
    <button class="filter-btn" onclick="setFilter('Жильё', this)">Жильё</button>
    <button class="filter-btn" onclick="setFilter('Развлечения', this)">Развлечения</button>
  </div>

  <div class="entries-card">
    <div class="entries-header">
      <span>Описание</span>
      <span class="cat-col">Категория</span>
      <span style="text-align:right;padding-right:0.5rem">Сумма</span>
      <span></span>
    </div>
    <div class="total-sum"><span>Итого по фильтру</span><div class="entry-amount neg">-<span class="sum">0</span> ₽</div></div>
    <div id="entries-list"><div class="empty">Загрузка...</div></div>
  </div>

</div>

<script>
  const VALID_TOKEN = 'fox'; // ← поменяй на любую строку
  const CAT_COLOR = {
    'Еда': '#b9975a', 'Транспорт': '#6a93b0', 'Жильё': '#8a6bb0',
    'Развлечения': '#b0708a', 'Здоровье': '#6bb08a', 'Прочее': '#8a8983'
  };
  const CATEGORIES = Object.keys(CAT_COLOR);

  const urlParams = new URLSearchParams(window.location.search);
  const token = urlParams.get('token');
  const hasAccess = token === VALID_TOKEN;

  if (hasAccess) {
    document.getElementById('stub').remove();
    document.getElementById('app').style.display = 'block';
  } else {
    document.getElementById('app').remove();
  }

  // ---- Захардкоженные демо-данные (пока без бэкенда) ----
  let entries = [
    { id: 1, desc: 'Зарплата', amount: 145000, date: '2026-07-01', cat: 'Прочее', type: 'income', method: 'Перевод' },
    { id: 2, desc: 'Пятёрочка', amount: 2340, date: '2026-07-01', cat: 'Еда', type: 'expense', method: 'Карта' },
    { id: 3, desc: 'Пятёрочка', amount: 1180, date: '2026-06-28', cat: 'Еда', type: 'expense', method: 'Карта' },
    { id: 4, desc: 'Такси', amount: 560, date: '2026-06-30', cat: 'Транспорт', type: 'expense', method: 'Карта' },
    { id: 5, desc: 'Такси', amount: 420, date: '2026-06-27', cat: 'Транспорт', type: 'expense', method: 'Наличные' },
    { id: 6, desc: 'Аренда квартиры', amount: 38000, date: '2026-07-01', cat: 'Жильё', type: 'expense', method: 'Перевод' },
    { id: 7, desc: 'Кинотеатр', amount: 1600, date: '2026-06-29', cat: 'Развлечения', type: 'expense', method: 'Карта' },
    { id: 8, desc: 'Аптека', amount: 890, date: '2026-06-26', cat: 'Здоровье', type: 'expense', method: 'Наличные' },
    { id: 9, desc: 'Фриланс проект', amount: 22000, date: '2026-06-25', cat: 'Прочее', type: 'income', method: 'Перевод' },
    { id: 10, desc: 'Кофе', amount: 320, date: '2026-06-24', cat: 'Еда', type: 'expense', method: 'Карта' },
  ];

  let filter = 'all';
  let currentType = 'expense';

  const today = new Date();
  document.getElementById('f-date').value = today.toISOString().split('T')[0];
  document.getElementById('month-label').textContent = today.toLocaleString('ru', { month: 'long', year: 'numeric' });
  renderChips();

  function setStatus(msg, cls) {
    const el = document.getElementById('save-status');
    el.textContent = msg;
    el.className = cls || '';
  }

  function setType(type) {
    currentType = type;
    document.getElementById('type-expense').classList.toggle('active', type === 'expense');
    document.getElementById('type-income').classList.toggle('active', type === 'income');
  }

  function renderChips() {
    const wrap = document.getElementById('cat-chips');
    const current = document.getElementById('f-cat').value;
    wrap.innerHTML = CATEGORIES.map(cat => `
      <button type="button" class="cat-chip ${cat === current ? 'active' : ''}" onclick="setCategory('${cat}')">
        <span class="dot" style="background:${CAT_COLOR[cat]}"></span>${cat}
      </button>
    `).join('');
  }

  function setCategory(cat) {
    document.getElementById('f-cat').value = cat;
    renderChips();
  }

  function fmt(n) {
    return n.toLocaleString('ru-RU', { minimumFractionDigits: 0, maximumFractionDigits: 0 }) + ' ₽';
  }

  function groupKey(e) {
    return e.desc.toLowerCase() + '||' + e.cat + '||' + e.type;
  }

  function addEntry() {
    const desc = document.getElementById('f-desc').value.trim();
    const amount = parseFloat(document.getElementById('f-amount').value);
    const date = document.getElementById('f-date').value;
    const cat = document.getElementById('f-cat').value;
    const method = document.getElementById('f-method').value;
    if (!desc || !amount || amount <= 0 || !date) return;

    entries.unshift({ id: Date.now(), desc, amount, date, cat, type: currentType, method });
    render();

    document.getElementById('f-desc').value = '';
    document.getElementById('f-amount').value = '';
    setStatus('Сохранено');
    setTimeout(() => setStatus(''), 1500);
  }

  function deleteEntry(id) {
    entries = entries.filter(e => e.id !== id);
    render();
  }

  const expanded = new Set();

  function toggleGroup(key) {
    if (expanded.has(key)) expanded.delete(key);
    else expanded.add(key);
    render();
  }

  function setFilter(f, btn) {
    filter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  }

  function renderChart() {
    const expenseEntries = entries.filter(e => e.type === 'expense');
    const totalExpense = expenseEntries.reduce((s, e) => s + e.amount, 0);

    const sums = {};
    CATEGORIES.forEach(c => sums[c] = 0);
    expenseEntries.forEach(e => sums[e.cat] = (sums[e.cat] || 0) + e.amount);

    document.getElementById('donut-total').textContent = fmt(totalExpense);

    const donut = document.getElementById('donut');
    const legend = document.getElementById('legend');

    if (totalExpense === 0) {
      donut.style.background = 'conic-gradient(var(--surface-2) 0deg 360deg)';
      legend.innerHTML = '<div class="legend-item"><span class="name" style="color:var(--muted)">Нет расходов за период</span></div>';
      return;
    }

    let angle = 0;
    const stops = [];
    const legendItems = [];
    CATEGORIES.forEach(cat => {
      const amt = sums[cat];
      if (amt <= 0) return;
      const share = amt / totalExpense;
      const start = angle;
      const end = angle + share * 360;
      stops.push(`${CAT_COLOR[cat]} ${start}deg ${end}deg`);
      angle = end;
      legendItems.push(`
        <div class="legend-item">
          <span class="dot" style="background:${CAT_COLOR[cat]}"></span>
          <span class="name">${cat}</span>
          <span class="pct">${Math.round(share * 100)}%</span>
          <span class="amt">${fmt(amt)}</span>
        </div>
      `);
    });

    donut.style.background = `conic-gradient(${stops.join(', ')})`;
    legend.innerHTML = legendItems.join('');
  }

  function render() {
    const income  = entries.filter(e => e.type === 'income').reduce((s, e) => s + e.amount, 0);
    const expense = entries.filter(e => e.type === 'expense').reduce((s, e) => s + e.amount, 0);
    const balance = income - expense;

    document.getElementById('s-income').textContent = fmt(income);
    document.getElementById('s-expense').textContent = fmt(expense);
    const balEl = document.getElementById('s-balance');
    balEl.textContent = (balance < 0 ? '-' : '') + fmt(Math.abs(balance));
    document.getElementById('s-balance-card').classList.toggle('neg', balance < 0);

    renderChart();

    let filtered = entries;
    if (filter === 'expense') filtered = entries.filter(e => e.type === 'expense');
    else if (filter === 'income') filtered = entries.filter(e => e.type === 'income');
    else if (filter !== 'all') filtered = entries.filter(e => e.cat === filter);

    const list = document.getElementById('entries-list');
    if (filtered.length === 0) {
      list.innerHTML = '<div class="empty">Записей нет</div>';
      document.querySelector('.total-sum .sum').textContent = '0';
      return;
    }

    const groupMap = new Map();
    filtered.forEach(e => {
      const key = groupKey(e);
      if (!groupMap.has(key)) groupMap.set(key, []);
      groupMap.get(key).push(e);
    });

    let html = '';
    let totalAll = 0;
    groupMap.forEach((items, key) => {
      const first = items[0];
      const total = items.reduce((s, e) => s + e.amount, 0);
      totalAll += first.type === 'income' ? total : -total;
      const isExpanded = expanded.has(key);
      const multiple = items.length > 1;
      const lastDate = items.reduce((latest, e) => e.date > latest ? e.date : latest, '');
      const d = new Date(lastDate + 'T00:00:00');
      const dateStr = d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });

      html += `<div class="entry group-row ${multiple ? 'expandable' : ''}" ${multiple ? `onclick="toggleGroup('${key.replace(/'/g, "\\'")}')"` : ''}>
        <div>
          <div class="entry-desc">
            ${multiple ? `<span class="expand-arrow">${isExpanded ? '▾' : '▸'}</span>` : ''}
            ${first.desc}
            ${multiple ? `<span class="count-badge"> · ${items.length}</span>` : ''}
          </div>
          <div class="entry-date">${dateStr}</div>
        </div>
        <div class="cat-col"><span class="cat-tag"><span class="dot" style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${CAT_COLOR[first.cat]};margin-right:0.4rem"></span>${first.cat}</span></div>
        <div class="entry-amount ${first.type === 'income' ? 'pos' : 'neg'}">
          ${first.type === 'income' ? '+' : '-'}${fmt(total)}
        </div>
        ${multiple ? '<div></div>' : `<button class="del-btn" onclick="event.stopPropagation(); deleteEntry(${first.id})">×</button>`}
      </div>`;

      if (multiple && isExpanded) {
        items.forEach(e => {
          const sd = new Date(e.date + 'T00:00:00');
          const sdStr = sd.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
          html += `<div class="entry sub-row">
            <div>
              <div class="entry-desc sub-desc">${sdStr} · ${e.method}</div>
            </div>
            <div class="cat-col"></div>
            <div class="entry-amount ${e.type === 'income' ? 'pos' : 'neg'} sub-amount">
              ${e.type === 'income' ? '+' : '-'}${fmt(e.amount)}
            </div>
            <button class="del-btn" onclick="event.stopPropagation(); deleteEntry(${e.id})">×</button>
          </div>`;
        });
      }
    });

    document.querySelector('.total-sum .entry-amount').className = 'entry-amount ' + (totalAll >= 0 ? 'pos' : 'neg');
    document.querySelector('.total-sum .entry-amount').innerHTML = (totalAll >= 0 ? '+' : '-') + '<span class="sum">' + fmt(Math.abs(totalAll)).replace(' ₽','') + '</span> ₽';
    list.innerHTML = html;
  }

  document.getElementById('f-desc').addEventListener('keydown', e => {
    if (e.key === 'Enter') addEntry();
  });

  render();
</script>
</div><!-- /app -->

</body>
</html>
